version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: crypto_db
    restart: always
    environment:
      MYSQL_DATABASE: blog_tech
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql

  backend:
    image: crypto-backend
    container_name: crypto_backend_app
    restart: always
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root_password
      - DB_NAME=blog_tech
    depends_on:
      - db

  frontend:
    image: crypto-frontend
    container_name: crypto_frontend_app
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: crypto_nginx
    restart: always 
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
volumes:
  db_data:
